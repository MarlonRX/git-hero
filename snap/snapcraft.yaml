name: git-hero
base: core22
version: '0.4.0'
summary: Simple Git repository manager TUI
description: |
  A simple repository manager for the terminal, written in Rust with Ratatui.
  See all your Git repositories at a glance (branch, ahead/behind, uncommitted
  files, last activity) with a recursive, type-to-filter repository browser,
  jump between them, and run the five everyday actions: status, commit, pull,
  push and branch switching. Not a full Git client: no interactive rebase or
  blame - that is lazygit territory.

grade: stable
confinement: strict

apps:
  git-hero:
    command: bin/git-hero
    plugs:
      - home
      - network
      - removable-media

parts:
  git-hero:
    plugin: rust
    source: .
    build-packages:
      - libssl-dev
      - pkg-config
    override-build: |
      cargo build --release --locked
      install -Dm755 target/release/git-hero $CRAFT_PART_INSTALL/bin/git-hero
